<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Checkout</title>
    
</head>
<body style="background-color: bisque;">


   <button class="go-back" onclick="goBack()">Cancel Order<style>
    .go-back {
    display: inline-block;
    padding: 12px 24px;
    margin-top: 10px;
    font-size: 16px;
    font-weight: bold;
    color: #fff;
    background-color: #C2DDFF; 
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s ease, transform 0.3s ease;
}


.go-back:hover {
    background-color: yellow; 
    transform: translateY(-2px); 
}


.go-back:active {
    background-color: orange; 
    transform: translateY(0); 
}
   </style><script>
    function goBack(){
        window.location.href = 'index.html';
    }
   </script></button>
   


    <h1>Checkout</h1>
    <form id="checkout-form">
        <label for="user-email">Enter your email:</label>
        <input type="email" id="user-email"  name="user_email" required aria-rowspan="10">
        <button class="add-to-cart" type="submit" >Place Order</button>
        <p id="checkout-error" role="alert" hidden></p>
    </form>

    <script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
</script>
<script type="text/javascript">
   (function(){
      emailjs.init({
        publicKey: "0bV0nGc60YdArm6YR",
      });
   })();



   document.getElementById('checkout-form').addEventListener('submit', async function(event) {
    event.preventDefault();

    const submitButton = event.currentTarget.querySelector('button[type="submit"]');
    const errorMessage = document.getElementById('checkout-error');
    errorMessage.hidden = true;

    let cart;
    try {
        cart = JSON.parse(localStorage.getItem('cartItems') || '[]');
    } catch (error) {
        console.error('Could not read cart items for checkout:', error);
        errorMessage.textContent = 'Your order details could not be loaded. Please return to your cart and try again.';
        errorMessage.hidden = false;
        return;
    }

    if (!Array.isArray(cart) || cart.length === 0) {
        errorMessage.textContent = 'Your cart is empty. Return to your cart and add items before placing an order.';
        errorMessage.hidden = false;
        return;
    }

    let itemsList = '';



    cart.forEach(item => {
        itemsList += `${item.name} x ${item.quantity} - ₦${item.price} = ₦${item.price * item.quantity}
        ` ;
    });

    function getTotalPrice(cart) {
        return cart.reduce((total, item) => {
           
            let priceString = item.price.toString();
            
            let price = parseFloat(priceString.replace('₦', '')) || 0;
            
            return total + (price * item.quantity);
        }, 0);
    }

    
    let totalPrice = getTotalPrice(cart).toFixed(2);
    totalPrice = "₦" + totalPrice; 

    
    let templateParams = {
        to_email: 'obieanidavid20@gmail.com',
        reply_to: document.getElementById('user-email').value,
        order_details: itemsList,
        total_price: totalPrice,
    };

    submitButton.disabled = true;
    try {
        const response = await emailjs.send("service_i4u6uw4", "template_qhy8dlj", templateParams);
        console.log('SUCCESS!', response.status, response.text);
        localStorage.removeItem('cartItems');
        window.location.href = 'Thanks.html';
    } catch (error) {
        console.error('Order email failed:', error);
        errorMessage.textContent = `We couldn't send your order. Please try again.${error?.text ? ` Details: ${error.text}` : ''}`;
        errorMessage.hidden = false;
        submitButton.disabled = false;
    }
});

       

    </script>

</body>
</html>
